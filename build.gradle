plugins {
    id 'java'
    id 'application'
}

// Версия Java
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Кодировка исходных файлов
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Репозитории
repositories {
    mavenCentral()
}

// Версии зависимостей
ext {
    lwjglVersion = "3.3.3"
    jomlVersion = "1.10.0"
    h2Version = "2.3.232"
    flywayVersion = "11.8.2"
}

// Определение платформы для нативных библиотек
def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()
def lwjglNatives = ""

if (osName.contains("win")) {
    lwjglNatives = "natives-windows"
} else if (osName.contains("mac")) {
    lwjglNatives = osArch.contains("aarch64") || osArch.contains("arm64") ? "natives-macos-arm64" : "natives-macos"
} else {
    lwjglNatives = "natives-linux"
}

dependencies {
    // LWJGL Core
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-assimp"
    
    // Нативные библиотеки для текущей ОС
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-assimp::$lwjglNatives"

    // JOML (Math library)
    implementation "org.joml:joml:$jomlVersion"

    // Локальная БД (файл data/db/inthemyst.mv.db) и миграции схемы
    implementation "com.h2database:h2:$h2Version"
    implementation "org.flywaydb:flyway-core:$flywayVersion"

    // Тесты
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Настройка приложения
application {
    // Главный класс игры
    mainClass = 'ru.phoenix.core.kernel.Game' 
}

// Задача запуска
tasks.named('run') {
    workingDir = file('.')
    // Аргументы JVM для увеличения стека, если нужно
    jvmArgs = ['-Xms512m', '-Xmx2g', '-Dfile.encoding=UTF-8']
}

// Задача сборки JAR
jar {
    manifest {
        attributes(
            'Main-Class': 'ru.phoenix.core.kernel.Game'
        )
    }
    // Включение зависимостей в один jar (опционально, требует shadowJar для полноценной работы)
    // Для простоты пока собираем только классы проекта
}

// Копирование ресурсов
sourceSets {
    main {
        java {
            srcDirs = ['src']
            // тесты лежат в src/test/java и не должны попадать в main
            exclude 'test/**'
        }
        resources {
            srcDirs = ['src/res', 'src/shaders']
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
